# Ready-made ChartLibre packages: Python and every library already inside,
# so they open the first time with no download (dev/tools/build_bundle.py).
#
# Runs when the packaging changes on main, by hand (Actions > Bundles > Run
# workflow), and for a version tag (v0.1.0), which also publishes them as
# that version's GitHub Release.
name: Bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/bundles.yml"
      - "dev/tools/build_bundle.py"
      - "dev/tools/make_launcher.py"
      - "dev/tools/installer/**"
      - "dev/tools/launcher/**"
      - "install.py"
      - "requirements.txt"

permissions:
  contents: read

# A newer push replaces a build still running for an older one.
concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-15 }
          - { name: Windows, os: windows-latest }
          - { name: Linux x86_64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          asound=$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 "$asound" xvfb xauth \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 libxcb-shm0

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'from app import APP_VERSION; print(APP_VERSION)')-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, test and pack
        shell: bash
        run: |
          set -o pipefail
          if ! python -u dev/tools/build_bundle.py --version "$VERSION" --work "$RUNNER_TEMP" 2>&1 | tee build.log; then
            # The end of the output as an annotation: unlike the log, it can
            # be read without signing in to GitHub.
            message=$(tail -n 60 build.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed (${{ matrix.name }})::$message"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ChartLibre-${{ env.VERSION }}-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          draft: true
          body: |
            Ready-made ChartLibre packages: Python and every library are inside, so nothing needs installing first and no internet is needed.

            - **macOS**: open the .dmg (Apple Silicon; on an Intel Mac use the source download, whose ChartLibre.app fetches its own Python) and drag the ChartLibre folder to Applications, then open ChartLibre.app inside it. The first time, macOS may say it cannot check the app: System Settings > Privacy & Security > Open Anyway.
            - **Windows**: run the -setup.exe (no administrator rights needed), or unzip the -portable.zip anywhere and open ChartLibre.exe. If Windows says it protected your PC: More info > Run anyway.
            - **Linux** (x86_64): unpack the .tar.gz and run ChartLibre/ChartLibre.sh; it adds itself to the applications menu. Qt may need `sudo apt install libxcb-cursor0`.
